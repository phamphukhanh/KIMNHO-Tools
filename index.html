<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <script src="script.js" defer></script>
    <title>KIMNHO Lathe</title>
</head>

<body>
    <nav class="navbar fixed-top navbar-light bg-kimnho">
        <span class="navbar-brand font-weight-bold" href="#">
          <img src="" width="30" height="30" class="d-inline-block align-top" alt="">
          D.N.T.N KIM NHỎ
        </span>
      </nav>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="row">
                    <div class="col-12">
                        <label class="font-weight-bold">Phần đầu</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>
                    <div class="col-12 mt-2">
                        <label class="mt-3 font-weight-bold">Phần đuôi</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </div>
            <div class="col-md-6 border-left pl-3">
                <div class="row mt-2">
                    <div class="col-md-6">
                        <label class="font-weight-bold">Từ tâm đi ra (X0.000 Y0.000)?</label>
                        <div>
                            <label class="mr-3"><input type="radio" name="center" value="yes"> Có</label>
                            <label><input type="radio" name="center" value="no" checked> Không</label>
                        </div>
                        <label class="font-weight-bold mt-2">Số Mils cần xuống:</label>
                        <input type="number" min="0" class="form-control" value="140">
                        <label class="font-weight-bold mt-2">Số Mils mỗi lần xuống:</label>
                        <input type="number" min="0" class="form-control" value="20">
                    </div>
                    <div class="border-left pl-3 col-md-6 ">
                        <label class="font-weight-bold">Thêm Program Start?</label>
                        <div>
                            <label class="mr-3"><input type="radio" name="start" value="yes"> Có</label>
                            <label><input type="radio" name="start" value="no" checked> Không</label>
                        </div>
                        <label class="font-weight-bold mt-2">Thêm Program End?</label>
                        <div>
                            <label class="mr-3"><input type="radio" name="end" value="yes"> Có</label>
                            <label><input type="radio" name="end" value="no" checked> Không</label>
                        </div>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-12">
                        <button class="btn btn-primary btn-block font-weight-bold">Xem kết quả</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="mt-3">
                    <label class="font-weight-bold">Kết quả</label>
                    <textarea id="ketQua" class="form-control" rows="5" readonly></textarea>
                </div>
                <div class="text-right mt-3">
                    <button class="btn btn-danger font-weight-bold">Xoá</button>
                    <button class="btn btn-outline-secondary font-weight-bold">Chỉnh sửa</button>
                    <button class="btn btn-success font-weight-bold">Lưu file</button>
                </div>
            </div>
        </div>
        <div class="row justify-content-center mt-3">
            <div class="col-md-12">
                <div class="map-container border border-dark">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3920.123721284843!2d106.60927110908843!3d10.724939689376583!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752d3f695fe6ed%3A0x48543434aab9ae73!2sD.N.T.N%20KIM%20NH%E1%BB%8E!5e0!3m2!1sen!2s!4v1743006131191!5m2!1sen!2s"
                        loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>

        <p class="text-center font-weight-light font-italic mt-3">
            Powered by
            <a href="https://linktr.ee/phukhanh" class="text-reset font-weight-normal">
                Khanh Pham
            </a>
        </p>

    </div>
</body>

</html>
