<!DOCTYPE html>
<html lang="vi">

<head>
    <!-- Script chặn chớp sáng (Chỉ 4 dòng code) -->
    <script>
        if (localStorage.getItem("theme") === "dark" || localStorage.getItem("darkMode") === "enabled") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon-16x16.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.2/css/font-awesome.min.css"
        integrity="sha512-DQ8AYRNJzvNabl2m6fcjEtXqhT7LoW4NsmYF31qUaavTFJfFHAs8zFuCpxOwWmn8rqrXpANVDZgvjO9bnAmLDw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS Tùy chỉnh theo từng phân đoạn -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/header.css">
    <link rel="stylesheet" href="assets/css/editor.css">
    <link rel="stylesheet" href="assets/css/darkmode.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <!-- Utility JS -->
    <script src="assets/js/utils/load-components.js"></script>
    <script src="assets/js/utils/clock.js"></script>
    <script src="assets/js/utils/darkmode.js"></script>
    <script src="assets/js/utils/line-numbers.js"></script>

    <!-- Module Xử lý G-Code -->
    <script src="assets/js/modules/gcode-processor.js"></script>

    <!-- Script Chính -->
    <script src="assets/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Bộ Xử Lý G-Code CNC - KIMNHO's Tools</title>
</head>

<body data-page-title="Bộ Xử Lý G-Code CNC" data-page-icon="fa-cogs">
    <!-- Nơi load thanh Header (Navbar) -->
    <div id="header-placeholder"></div>

    <div class="container mt-3">
        <!-- Tiêu đề và hướng dẫn công cụ -->
        <h3 class="text-center font-weight-bold">
            <div class="btn-group">
                <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown" data-display="static"
                    aria-haspopup="true" aria-expanded="false">
                    <span class="h3 font-weight-bold">Cắt</span>
                </button>
                <div class="dropdown-menu dropdown-menu-right dropdown-menu-lg-left">
                    <button class="dropdown-item" type="button">Cắt</button>
                    <button class="dropdown-item" type="button">Đục lỗ</button>
                    <button class="dropdown-item" type="button">Chạy độ ring</button>
                </div>
            </div>
            <span data-toggle="tooltip" data-placement="right" data-html="true" title="
                <div style='text-align: justify; max-width: 250px;'>
                <b>Cắt đường thẳng, đường cong, khắc chữ block.</b><br><br>
                1. Chạy BobCad 1 vòng.<br>
                2. Copy G-code vào, không cần xoá Z0.<br><br>
                <b class='text-danger'><u>Lưu ý:</u></b> Nhiều vòng khác nhau phải <u>để ý mũi</u>
            </div>" class="ml-1 small-tooltip">
                <i class="fa fa-info-circle"></i>
            </span>
        </h3>

        <!-- KHUNG CHÍNH CHỨA EDITOR & OPTIONS -->
        <div class="border p-3 rounded shadow-sm">
            <div class="row">
                <!-- =============== CỘT TRÁI: TEXTAREA G-CODE =============== -->
                <div class="col-lg-6 mb-3 mb-lg-0 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="font-weight-bold mb-0">G-code CNC</label>
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" id="keep-options">
                            <label class="custom-control-label font-weight-bold mb-0" for="keep-options">Giữ lựa
                                chọn</label>
                        </div>
                    </div>
                    <!-- flex-grow-1 giúp textarea tự căn chiều cao bằng đúng nút "Xem kết quả" bên phải -->
                    <textarea id="inputCNC" class="form-control flex-grow-1"
                        style="min-height: 220px; resize: vertical;" required></textarea>
                </div>

                <!-- =============== CỘT PHẢI: KHUNG CẤU HÌNH =============== -->
                <div class="col-lg-6 d-flex flex-column">
                    <!-- Card dùng flex-grow-1 để tự co giãn vừa vặn -->
                    <div class="card shadow-sm border bg-light rounded flex-grow-1">
                        <div class="card-body p-3">
                            <div class="row">

                                <!-- Cột Tùy Chọn Tính Năng -->
                                <div id="form-section" class="col-md-6 border-md-right pb-3 pb-md-0 mb-3 mb-md-0">
                                    <!-- Form Cắt -->
                                    <div id="form-cut">
                                        <div class="form-group mb-3">
                                            <label class="font-weight-bold text-secondary small text-uppercase mb-1"
                                                for="mil-down">Số Mil cần xuống:</label>
                                            <input type="number" min="0" class="form-control form-control-sm"
                                                id="mil-down" required>
                                        </div>

                                        <div class="form-group mb-3">
                                            <label class="font-weight-bold text-secondary small text-uppercase mb-2">Số
                                                Mil mỗi lần xuống:</label>

                                            <!-- Container ép 3 nút trên 1 hàng -->
                                            <div class="compact-radio-group">
                                                <div class="custom-control custom-radio custom-control-inline">
                                                    <input type="radio" id="cut-5" name="cut-depth" value="5"
                                                        class="custom-control-input" checked>
                                                    <label class="custom-control-label" for="cut-5">5 Mils</label>
                                                </div>
                                                <div class="custom-control custom-radio custom-control-inline">
                                                    <input type="radio" id="cut-20" name="cut-depth" value="20"
                                                        class="custom-control-input">
                                                    <label class="custom-control-label" for="cut-20">20 Mils</label>
                                                </div>
                                                <div class="custom-control custom-radio custom-control-inline">
                                                    <input type="radio" id="cut-custom" name="cut-depth" value="custom"
                                                        class="custom-control-input">
                                                    <label class="custom-control-label" for="cut-custom">Số khác</label>
                                                </div>
                                            </div>

                                            <div id="custom-cut-depth" class="mt-2" style="display: none;">
                                                <input id="customCutDepthValue" type="number" min="0"
                                                    class="form-control form-control-sm" placeholder="Nhập số mil">
                                            </div>
                                        </div>

                                        <div class="form-group mb-0">
                                            <label
                                                class="font-weight-bold text-secondary small text-uppercase mb-2 text-decoration-underline">Từ
                                                tâm đi ra (X0.0 Y0.0)?</label>
                                            <div class="d-flex" style="gap: 15px;">
                                                <div class="custom-control custom-radio custom-control-inline mr-0">
                                                    <input type="radio" id="center-yes" name="center" value="yes"
                                                        class="custom-control-input">
                                                    <label class="custom-control-label" for="center-yes">Có</label>
                                                </div>
                                                <div class="custom-control custom-radio custom-control-inline mr-0">
                                                    <input type="radio" id="center-no" name="center" value="no"
                                                        class="custom-control-input" checked>
                                                    <label class="custom-control-label" for="center-no">Không</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Form Đục Lỗ -->
                                    <div id="form-drill" style="display: none;">
                                        <div class="form-group mb-3">
                                            <label
                                                class="font-weight-bold text-secondary small text-uppercase mb-2">Chọn
                                                độ sâu:</label>
                                            <div class="d-flex flex-wrap" style="gap: 12px;">
                                                <div class="custom-control custom-radio custom-control-inline mr-0">
                                                    <input type="radio" id="drill-5" name="drill-depth" value="5"
                                                        class="custom-control-input" checked>
                                                    <label class="custom-control-label" for="drill-5">5 Mils</label>
                                                </div>
                                                <div class="custom-control custom-radio custom-control-inline mr-0">
                                                    <input type="radio" id="drill-custom" name="drill-depth"
                                                        value="custom" class="custom-control-input">
                                                    <label class="custom-control-label" for="drill-custom">Số
                                                        khác</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div id="custom-drill-depth" class="mt-2" style="display: none;">
                                            <div class="form-group mb-2">
                                                <label class="font-weight-bold text-secondary small mb-1">Số Mil cần
                                                    xuống:</label>
                                                <input id="customDrillDepthValue" type="number" min="0"
                                                    class="form-control form-control-sm">
                                            </div>
                                            <div class="form-group mb-0">
                                                <label class="font-weight-bold text-secondary small mb-1">Số Mil mỗi lần
                                                    xuống:</label>
                                                <input id="customDrillEachValue" type="number" min="0"
                                                    class="form-control form-control-sm">
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Form Chạy Độ Ring -->
                                    <div id="form-ring-angle" style="display: none;">
                                        <div class="form-group mb-2">
                                            <label class="font-weight-bold text-secondary small text-uppercase mb-1"
                                                for="ceramic-thickness">Bề dày phôi sứ:</label>
                                            <select class="form-control form-control-sm" id="ceramic-thickness">
                                                <option value="125">125</option>
                                                <option value="187">187</option>
                                                <option value="250">250</option>
                                                <option value="375">375</option>
                                            </select>
                                        </div>
                                        <div class="form-group mb-2">
                                            <label class="font-weight-bold text-secondary small text-uppercase mb-1"
                                                for="ring-angles">Độ ring:</label>
                                            <select class="form-control form-control-sm" id="ring-angles">
                                                <option value="5">5°</option>
                                                <option value="6">6°</option>
                                                <option value="7" selected>7°</option>
                                                <option value="8">8°</option>
                                                <option value="9">9°</option>
                                                <option value="10">10°</option>
                                                <option value="11">11°</option>
                                                <option value="12">12°</option>
                                                <option value="13">13°</option>
                                                <option value="14">14°</option>
                                                <option value="15">15°</option>
                                                <option value="16">16°</option>
                                                <option value="17">17°</option>
                                                <option value="18">18°</option>
                                                <option value="19">19°</option>
                                                <option value="20">20°</option>
                                            </select>
                                        </div>
                                        <div class="form-group mb-0">
                                            <label
                                                class="font-weight-bold text-secondary small mb-1 text-decoration-underline"
                                                for="ring-bottom-thickness">Bề dày đít ring (tính thêm recess nếu có):</label>
                                            <input type="number" min="60" max="250" class="form-control form-control-sm"
                                                id="ring-bottom-thickness" placeholder="Tối thiểu 60 mils" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- Cột Cấu Hình Format Đầu Ra -->
                                <div class="col-md-6 pl-md-4">
                                    <div class="form-group mb-3">
                                        <label class="font-weight-bold text-secondary small text-uppercase mb-2">Thêm
                                            Program Start, End?</label>
                                        <div class="d-flex" style="gap: 15px;">
                                            <div class="custom-control custom-radio custom-control-inline mr-0">
                                                <input type="radio" id="start-yes" name="start-end" value="yes"
                                                    class="custom-control-input">
                                                <label class="custom-control-label" for="start-yes">Có</label>
                                            </div>
                                            <div class="custom-control custom-radio custom-control-inline mr-0">
                                                <input type="radio" id="start-no" name="start-end" value="no"
                                                    class="custom-control-input" checked>
                                                <label class="custom-control-label" for="start-no">Không</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="form-group mb-3">
                                        <label class="font-weight-bold text-secondary small text-uppercase mb-2">Cách
                                            dòng?</label>
                                        <div class="d-flex" style="gap: 15px;">
                                            <div class="custom-control custom-radio custom-control-inline mr-0">
                                                <input type="radio" id="space-yes" name="spacing" value="yes"
                                                    class="custom-control-input">
                                                <label class="custom-control-label" for="space-yes">Có</label>
                                            </div>
                                            <div class="custom-control custom-radio custom-control-inline mr-0">
                                                <input type="radio" id="space-no" name="spacing" value="no"
                                                    class="custom-control-input" checked>
                                                <label class="custom-control-label" for="space-no">Không</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="form-group mb-0">
                                        <label class="font-weight-bold text-secondary small text-uppercase mb-2">Thêm
                                            chú thích?</label>
                                        <div class="d-flex" style="gap: 15px;">
                                            <div class="custom-control custom-radio custom-control-inline mr-0">
                                                <input type="radio" id="cmt-yes" name="comment" value="yes"
                                                    class="custom-control-input">
                                                <label class="custom-control-label" for="cmt-yes">Có</label>
                                            </div>
                                            <div class="custom-control custom-radio custom-control-inline mr-0">
                                                <input type="radio" id="cmt-no" name="comment" value="no"
                                                    class="custom-control-input" checked>
                                                <label class="custom-control-label" for="cmt-no">Không</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- Nút Xem Kết Quả đứng gọn gàng ở đáy cột phải -->
                    <button class="btn btn-primary btn-block font-weight-bold shadow-sm py-2 mt-3">
                        <i class="fa fa-play mr-2"></i> Xem kết quả
                    </button>
                </div>
            </div>

            <!-- =============== KHU VỰC KẾT QUẢ ĐẦU RA =============== -->
            <div class="row mt-4">
                <div class="col-12 mb-2">
                    <label class="h5 font-weight-bold mb-0 text-primary" id="result-label">Kết quả</label>
                </div>

                <!-- Cột trái: Trình biên tập Output -->
                <div class="col">
                    <div class="gcode-editor-container border rounded d-flex overflow-hidden shadow-sm">
                        <div id="line-numbers" class="line-numbers">1</div>
                        <textarea id="result" class="form-control border-0 rounded-0 flex-grow-1" rows="7" readonly
                            wrap="off"></textarea>
                    </div>
                </div>

                <!-- Cột phải: Dãy Nút Thao Tác Output -->
                <div class="col-auto pl-0">
                    <div class="action-buttons-sticky">
                        <button class="btn btn-danger btn-block font-weight-bold mb-2 shadow-sm">
                            <i class="fa fa-trash-o"></i> Xoá
                        </button>
                        <button class="btn btn-outline-secondary btn-block font-weight-bold mb-2 shadow-sm bg-white"
                            id="edit-button">
                            <i class="fa fa-pencil-square-o"></i> <span class="btn-text">Sửa tay</span>
                        </button>
                        <button id="copy-button" class="btn btn-secondary btn-block font-weight-bold mb-2 shadow-sm">
                            <i class="fa fa-copy"></i> Copy
                        </button>
                        <button class="btn btn-success btn-block font-weight-bold mb-2 shadow-sm">
                            <i class="fa fa-floppy-o"></i> Lưu file
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Nơi load Footer -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Nút Cuộn Lên Đầu Trang -->
    <button id="scrollTopBtn" class="btn btn-info font-weight-bold rounded-circle shadow"
        style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; width: 45px; height: 45px; display: none;">
        <i class="fa fa-arrow-up"></i>
    </button>

    <!-- Thư viện Bootstrap & jQuery -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.6/dist/umd/popper.min.js"
        integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js"
        integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k"
        crossorigin="anonymous"></script>
</body>

</html>
