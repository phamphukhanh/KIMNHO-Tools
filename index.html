<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./images/favicon-16x16.png?">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.2/css/font-awesome.min.css"
        integrity="sha512-DQ8AYRNJzvNabl2m6fcjEtXqhT7LoW4NsmYF31qUaavTFJfFHAs8zFuCpxOwWmn8rqrXpANVDZgvjO9bnAmLDw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/style.css">
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>KIMNHO Lathe</title>
</head>

<body>
    <ul class="nav nav-pills p-2 bg-kimnho font-weight-bold" id="pills-tab" role="tablist">
        <li class="nav-item mr-auto">
            <span class="ml-2 d-flex align-items-center">
                <img src="images/DNTN.png" width="30" height="30" class="mr-2 d-inline-block align-top" alt="">
                <span class="align-middle">D.N.T.N KIM NHỎ</span>
            </span>
        </li>
    </ul>

    <div class="container mt-3">
        <h3 class="text-center font-weight-bold">
            <div class="btn-group">
                <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown" data-display="static"
                    aria-haspopup="true" aria-expanded="false">
                    <span class="h3 font-weight-bold">Cắt</span>
                </button>
                <div class="dropdown-menu dropdown-menu-right dropdown-menu-lg-left">
                    <button class="dropdown-item" type="button">Cắt</button>
                    <button class="dropdown-item" type="button">Đục lỗ</button>
                    <button class="dropdown-item" type="button">Chạy độ ring</button>
                </div>
            </div>
            <span data-toggle="tooltip" data-placement="right" data-html="true" title="
                <div style='text-align: justify; max-width: 250px;'>
                <b>Cắt đường thẳng, đường cong, khắc chữ block.</b><br><br>
                1. Chạy BobCad 1 vòng.<br>
                2. Copy G-code vào, không cần xoá Z0.<br><br>
                <b class='text-danger'><u>Lưu ý:</u></b> Nhiều vòng khác nhau phải <u>để ý mũi</u>
            </div>" class="ml-1 small-tooltip">
                <i class="fa fa-info-circle"></i>
            </span>
        </h3>
        <div class="border p-3 rounded shadow-sm">
            <div class="row">
                <div class="col-md-6">
                    <div class="row">
                        <div class="col-12">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="font-weight-bold mb-0">G-code CNC</label>
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="keep-options">
                                    <label class="custom-control-label font-weight-bold mb-0" for="keep-options">Giữ lựa
                                        chọn</label>
                                </div>
                            </div>
                            <textarea id="inputCNC" class="form-control mt-2" rows="10" required>
G00 X-0.1745 Y0.3512 Z0.
X0.1745 Y0.3512 Z0.
G02 X0.5245 Y0.0002 I0. J-0.35
X0.1745 Y-0.3508 I-0.35 J-0.001
G01 X-0.1745 Y-0.3508 Z0.
G02 X-0.5245 Y0.0002 I0. J0.35
X-0.1745 Y0.3512 I0.35 J0.001
G01 X0.1745 Y0.3512 Z0.

G00 X-0.1745 Y0.3012 Z0.
G01 X0.1745 Y0.3012 Z0.
G02 X0.4745 Y0.0003 I0. J-0.3
G02 X0.1745 Y-0.3008 I-0.3 J-0.0009
G01 X-0.1745 Y-0.3008 Z0.
G02 X-0.4745 Y0.0001 I0. J0.3
G02 X-0.1745 Y0.3012 I0.3 J0.0009
G01 X0.1745 Y0.3012 Z0.

G00 X-0.1745 Y0.2512 Z0.
G01 X0.1745 Y0.2512 Z0.
G02 X0.4245 Y0.0005 I0. J-0.25
G02 X0.1745 Y-0.2508 I-0.25 J-0.0007
G01 X-0.1745 Y-0.2508 Z0.
G02 X-0.4245 Y-0.0001 I0. J0.25
G02 X-0.1745 Y0.2512 I0.25 J0.0007
G01 X0.1745 Y0.2512 Z0.

G00 X0.1745 Y0.2012 Z0.
G01 X-0.1745 Y0.2012 Z0.
G03 X-0.3745 Y0.0006 I0. J-0.2
G03 X-0.1745 Y-0.2008 I0.2 J-0.0006
G01 X0.1745 Y-0.2008 Z0.
G03 X0.3745 Y-0.0002 I0. J0.2
G03 X0.1745 Y0.2012 I-0.2 J0.0006
G01 X-0.1745 Y0.2012 Z0.
                            </textarea>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 border-left pl-3">
                    <div class="row mt-2">
                        <div id="form-section" class="col-md-6">
                            <!-- Form Cắt mặc định -->
                            <div id="form-cut">
                                <label class="font-weight-bold"><ins>Từ tâm đi ra (X0.000 Y0.000)?</ins></label>
                                <div>
                                    <label class="mr-3"><input type="radio" name="center" value="yes"> Có</label>
                                    <label><input type="radio" name="center" value="no" checked> Không</label>
                                </div>
                                <label class="font-weight-bold mt-2">Số Mil cần xuống:</label>
                                <input type="number" min="0" class="form-control" required>
                                <label class="font-weight-bold mt-2">Số Mil mỗi lần xuống:</label>
                                <div>
                                    <label class="mr-2">
                                        <input type="radio" name="cut-depth" value="5" checked> 5 Mils
                                    </label>
                                    <label class="mr-2">
                                        <input type="radio" name="cut-depth" value="20"> 20 Mils
                                    </label>
                                    <label class="mr-2">
                                        <input type="radio" name="cut-depth" value="custom"> Số khác
                                    </label>
                                </div>
                                <div id="custom-cut-depth" class="mt-1" style="display: none;">
                                    <input id="customCutDepthValue" type="number" min="0" class="form-control">
                                </div>
                            </div>

                            <!-- Form Đục lỗ: ẩn lúc đầu -->
                            <div id="form-drill" style="display: none;">
                                <label class="font-weight-bold">Chọn độ sâu:</label>
                                <div>
                                    <label class="mr-3">
                                        <input type="radio" name="drill-depth" value="5" checked> 5 Mils
                                    </label>
                                    <label>
                                        <input type="radio" name="drill-depth" value="custom"> Số khác
                                    </label>
                                </div>
                                <div id="custom-drill-depth" class="mt-2" style="display: none;">
                                    <label class="font-weight-bold">Số Mil cần xuống:</label>
                                    <input id="customDrillDepthValue" type="number" min="0" class="form-control">
                                    <label class="font-weight-bold">Số Mil mỗi lần xuống:</label>
                                    <input id="customDrillEachValue" type="number" min="0" class="form-control">
                                </div>
                            </div>


                            <!-- Form Chạy độ ring: ẩn lúc đầu -->
                            <div id="form-ring-angle" style="display: none;">
                                <label class="font-weight-bold" for="ceramic-thickness">Chọn bề dày sứ:</label>
                                <select class="form-control" id="ceramic-thickness">
                                    <option value="125">125</option>
                                    <option value="187">187</option>
                                    <option value="250">250</option>
                                    <option value="375">375</option>
                                </select>
                                <label class="font-weight-bold mt-2">Chọn độ ring</label>
                                <div>
                                    <select class="form-control" id="ring-angles">
                                        <option value="5" selected>5 độ</option>
                                        <option value="6">6 độ</option>
                                        <option value="7">7 độ</option>
                                        <option value="8">8 độ</option>
                                        <option value="9">9 độ</option>
                                        <option value="10">10 độ</option>
                                        <option value="11">11 độ</option>
                                        <option value="12">12 độ</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="font-weight-bold">Nhập bề dày đít ring <u>(tính luôn recess nếu
                                            có)</u></label>
                                    <input type="number" min="60" class="form-control" id="ring-bottom-thickness"
                                        placeholder="Đít ring + Recess (nếu có)">
                                </div>
                            </div>
                        </div>
                        <div class="border-left pl-3 col-md-6 ">
                            <label class="font-weight-bold">Thêm Program Start, Program End?</label>
                            <div>
                                <label class="mr-3"><input type="radio" name="start-end" value="yes"> Có</label>
                                <label><input type="radio" name="start-end" value="no" checked> Không</label>
                            </div>
                            <label class="font-weight-bold">Cách dòng?</label>
                            <div>
                                <label class="mr-3"><input type="radio" name="spacing" value="yes"> Có</label>
                                <label><input type="radio" name="spacing" value="no" checked> Không</label>
                            </div>
                            <label class="font-weight-bold">Thêm chú thích?</label>
                            <div>
                                <label class="mr-3"><input type="radio" name="comment" value="yes"> Có</label>
                                <label><input type="radio" name="comment" value="no" checked> Không</label>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <button class="btn btn-primary btn-block font-weight-bold">Xem kết quả</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="mt-3">
                        <!-- Hàng ngang: label bên trái, nút bên phải -->
                        <label class="h5 font-weight-bold mb-0" id="result-label">Kết quả</label>
                        <!-- <div class="d-flex justify-content-between align-items-center">
                            <button id="copy-button" class="btn btn-secondary font-weight-bold">
                                <i class="fa fa-copy"></i>
                                Copy
                            </button>
                        </div> -->

                        <textarea id="result" class="form-control mt-2" rows="5" readonly></textarea>
                    </div>
                    <div class="text-right mt-3">
                        <button class="btn btn-danger font-weight-bold">
                            <i class="fa fa-trash-o"></i>
                            Xoá
                        </button>
                        <button class="btn btn-outline-secondary font-weight-bold" id="edit-button">
                            <i class="fa fa-pencil-square-o"></i>
                            <span class="btn-text">Chỉnh sửa</span>
                        </button>
                        <button id="copy-button" class="btn btn-secondary font-weight-bold">
                            <i class="fa fa-copy"></i>
                            Copy
                        </button>
                        <button class="btn btn-success font-weight-bold">
                            <i class="fa fa-floppy-o"></i>
                            Lưu file
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center mt-3">
            <div class="col-md-3">
                <div class="d-flex justify-content-center align-items-center h-100">
                    <img src="images/DNTN-full.png" height="260" class="d-inline-block p-4" alt="">
                </div>
            </div>
            <div class="col-md-9">
                <div class="map-container border border-dark">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3920.123721284843!2d106.60927110908843!3d10.724939689376583!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752d3f695fe6ed%3A0x48543434aab9ae73!2sD.N.T.N%20KIM%20NH%E1%BB%8E!5e0!3m2!1sen!2s!4v1743006131191!5m2!1sen!2s"
                        loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>

        <p class="text-center font-weight-light font-italic mt-3 text-black-50">
            Powered by
            <a href="https://linktr.ee/phukhanh" class="text-reset font-weight-normal">
                Khanh Pham
            </a>
        </p>
    </div>

        ▲
    </button>

</body>
