<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon-16x16.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.2/css/font-awesome.min.css">

    <!-- CSS Hệ thống (Sử dụng ../ để đi ra khỏi thư mục pages) -->
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/darkmode.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/pad-dxf.css">

    <!-- Script dùng chung -->
    <script src="../assets/js/utils/load-components.js"></script>
    <script src="../assets/js/utils/clock.js"></script>
    <script src="../assets/js/utils/darkmode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>Tạo Layout DXF Từ Tọa Độ PAD - KIMNHO</title>
</head>

<body>
    <!-- Bơm Header tự động -->
    <div id="header-placeholder"></div>

    <div class="container-fluid px-md-4 mt-3">
        <!-- TIÊU ĐỀ CÔNG CỤ -->
        <h3 class="text-center font-weight-bold mb-3">
            <span class="h3 font-weight-bold text-info">
                <i class="fa fa-crosshairs mr-2"></i>Tạo Layout DXF Từ Tọa Độ PAD (µm &rarr; Inch)
            </span>
        </h3>

        <!-- VÙNG CÔNG CỤ (XYC 2 DXF) -->
        <div class="main-wrapper">
            <!-- NỬA TRÁI: BẢNG DỮ LIỆU INPUT -->
            <div class="table-section">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="font-weight-bold mb-0 text-primary">Bảng Tọa Độ Chân (Micromet)</h5>
                    <small class="text-muted"><i class="fa fa-info-circle mr-1"></i>Dán trực tiếp (Ctrl+V) từ
                        Excel</small>
                </div>

                <div class="toolbar mb-3">
                    <!-- Thêm ô nhập Kích thước Pad ở đây -->
                    <div class="d-flex align-items-center mb-2 mb-sm-0">
                        <label for="pad-size-mil" class="mb-0 font-weight-bold mr-2 text-nowrap"
                            style="font-size: 13px;">Kích thước Pad (Mil):</label>
                        <input type="number" id="pad-size-mil" class="form-control form-control-sm" value="1" min="0.01"
                            step="0.1" style="width: 85px;">
                    </div>

                    <div class="btn-group mb-2 mb-sm-0">
                        <button class="btn btn-sm btn-secondary font-weight-bold mr-1" id="btn-add-row">
                            <i class="fa fa-plus mr-1"></i>Thêm dòng
                        </button>
                        <button class="btn btn-sm btn-outline-danger font-weight-bold" id="btn-clear-table">
                            <i class="fa fa-trash mr-1"></i>Làm sạch
                        </button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-info font-weight-bold mr-1" id="btn-draw-preview">
                            <i class="fa fa-eye mr-1"></i>Cập nhật Bản Đồ
                        </button>
                        <button class="btn btn-sm btn-success font-weight-bold" id="btn-export-dxf">
                            <i class="fa fa-download mr-1"></i>Xuất DXF
                        </button>
                    </div>
                </div>

                <div class="table-container border rounded">
                    <table id="dataTable" class="table table-bordered table-sm mb-0">
                        <thead class="thead-dark">
                            <tr>
                                <th class="idx-col text-center">#</th>
                                <th>Probe ID</th>
                                <th>X (µm)</th>
                                <th>Y (µm)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- NỬA PHẢI: MÀN HÌNH MÔ PHỎNG RADAR CANVAS -->
            <div class="preview-section">
                <h5 class="preview-header">
                    <span><i class="fa fa-map-o mr-2"></i>Bản Đồ Layout (Mô phỏng)</span>
                    <small class="text-muted" style="font-size: 12px;">(Cuộn chuột để Zoom, Rê chuột để Di
                        chuyển)</small>
                </h5>
                <canvas id="layoutCanvas"></canvas>
            </div>
        </div>

        <!-- Bơm Footer tự động -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Module JS xử lý DXF và Canvas -->
    <script src="../assets/js/modules/xyc-2-dxf.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js"></script>
</body>

</html>
