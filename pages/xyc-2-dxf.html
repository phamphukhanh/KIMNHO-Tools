<!DOCTYPE html>
<html lang="vi">

<head>
    <!-- Script chặn chớp sáng (Chỉ 4 dòng code) -->
    <script>
        if (localStorage.getItem("theme") === "dark" || localStorage.getItem("darkMode") === "enabled") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon-16x16.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.2/css/font-awesome.min.css">

    <!-- CSS Hệ thống (Sử dụng ../ để đi ra khỏi thư mục pages) -->
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/darkmode.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/pad-dxf.css">

    <!-- Script dùng chung -->
    <script src="../assets/js/utils/load-components.js"></script>
    <script src="../assets/js/utils/clock.js"></script>
    <script src="../assets/js/utils/darkmode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Tạo Layout DXF Từ Tọa Độ PAD - KIMNHO</title>
</head>

<body data-page-title="Chuyển XYC Qua DXF" data-page-icon="fa-crosshairs">
    <!-- Bơm Header tự động -->
    <div id="header-placeholder"></div>

    <div class="container-fluid px-md-4 mt-3">
        <!-- VÙNG CÔNG CỤ (XYC 2 DXF) -->
        <div class="main-wrapper">
            <!-- KHỐI BÊN TRÁI: BẢNG DỮ LIỆU INPUT -->
            <div class="table-section">
                <!-- THANH CÔNG CỤ (TOOLBAR) -->
                <div class="toolbar-card bg-light p-3 rounded border mb-3">

                    <!-- Hàng 1: Cấu hình PAD (Canh giữa 100% theo chiều ngang) -->
                    <div class="d-flex align-items-center justify-content-center mb-2 pb-2 border-bottom"
                        style="min-height: 31px;">
                        <div class="d-flex flex-wrap align-items-center justify-content-center" style="gap: 16px;">

                            <!-- 1. Chọn hình dáng -->
                            <div class="d-inline-flex align-items-center bg-white border rounded px-3 shadow-sm"
                                style="height: 31px; gap: 10px;">
                                <span class="text-secondary font-weight-bold"
                                    style="font-size: 13px; line-height: 1; white-space: nowrap;">Dạng:</span>

                                <!-- Option Vuông -->
                                <label class="d-inline-flex align-items-center mb-0 font-weight-bold text-dark"
                                    style="font-size: 13px; cursor: pointer; user-select: none; line-height: 1;">
                                    <input type="radio" id="shape-square" name="padShape" value="square" checked
                                        style="cursor: pointer; margin: 0 4px 0 0;">
                                    <span>Vuông</span>
                                </label>

                                <!-- Option Tròn -->
                                <label class="d-inline-flex align-items-center mb-0 font-weight-bold text-dark"
                                    style="font-size: 13px; cursor: pointer; user-select: none; line-height: 1;">
                                    <input type="radio" id="shape-circle" name="padShape" value="circle"
                                        style="cursor: pointer; margin: 0 4px 0 0;">
                                    <span>Tròn</span>
                                </label>

                                <!-- Option Điểm -->
                                <label class="d-inline-flex align-items-center mb-0 font-weight-bold text-dark"
                                    style="font-size: 13px; cursor: pointer; user-select: none; line-height: 1;">
                                    <input type="radio" id="shape-point" name="padShape" value="point"
                                        style="cursor: pointer; margin: 0 4px 0 0;">
                                    <span>Điểm</span>
                                </label>
                            </div>

                            <!-- 2. Kích thước Pad -->
                            <div id="pad-size-container" class="d-inline-flex align-items-center" style="height: 31px;">
                                <label for="pad-size-mil" class="mb-0 font-weight-bold mr-2 text-secondary text-nowrap"
                                    style="font-size: 13px; line-height: 1;">
                                    <i class="fa fa-arrows-alt mr-1"></i>Kích thước (Mil):
                                </label>
                                <input type="number" id="pad-size-mil"
                                    class="form-control form-control-sm font-weight-bold text-center" value="1"
                                    min="0.01" step="0.1" style="width: 70px; height: 31px;">
                            </div>

                        </div>
                    </div>

                    <!-- Hàng 2: Hướng dẫn bên trái & Thao tác (Làm sạch, Xuất DXF) bên phải -->
                    <div class="d-flex flex-wrap align-items-center justify-content-between" style="gap: 8px;">
                        <small class="text-muted"><i class="fa fa-info-circle mr-1"></i>Dán (Ctrl+V) dữ liệu từ
                            Excel</small>

                        <div class="d-inline-flex align-items-center ml-auto" style="gap: 8px;">
                            <button class="btn btn-sm btn-outline-danger font-weight-bold text-nowrap"
                                id="btn-clear-table" style="height: 31px;">
                                <i class="fa fa-trash mr-1"></i>Xóa toàn bộ
                            </button>

                            <button class="btn btn-sm btn-success font-weight-bold px-3 text-nowrap" id="btn-export-dxf"
                                style="height: 31px;">
                                <i class="fa fa-download mr-1"></i>Xuất DXF
                            </button>
                        </div>
                    </div>
                </div>

                <!-- BẢNG TỌA ĐỘ -->
                <div class="table-container border rounded">
                    <table id="dataTable" class="table table-bordered table-sm mb-0">
                        <thead class="thead-dark text-center">
                            <tr>
                                <th class="idx-col" style="width: 8%;">#</th>
                                <th style="width: 32%;">Probe ID</th>
                                <th style="width: 30%;">X (µm)</th>
                                <th style="width: 30%;">Y (µm)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- KHỐI BÊN PHẢI: PAD LAYOUT MÔ PHỎNG -->
            <div class="preview-section">
                <div class="preview-header mb-3">
                    <h5 class="m-0 font-weight-bold text-success">
                        <i class="fa fa-crosshairs mr-2"></i>Pad Layout
                    </h5>

                    <!-- NÚT REFRESH TRÊN HEADER PAD LAYOUT -->
                    <button class="btn btn-sm btn-outline-light font-weight-bold" id="btn-draw-preview"
                        title="Cập nhật (Refresh)" data-toggle="tooltip">
                        <i class="fa fa-refresh"></i>
                    </button>
                </div>
                <canvas id="layoutCanvas"></canvas>
            </div>
        </div>

        <!-- Bơm Footer tự động -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Module JS xử lý DXF và Canvas -->
    <script src="../assets/js/modules/xyc-2-dxf.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js"></script>
</body>

</html>
